kind: IngestionJob
name: postgresql-sales-segments-manual
owner: data-team
connection: sales-postgresql-connection
source:
  query: |
    SELECT segment_id, segment_name
    FROM segments
sink:
  template: adls_parquet@1
  params:
    target_file_size_mb: 128
    storage_account: dataonboardingplatform
    path: postgresql/sales/segment
