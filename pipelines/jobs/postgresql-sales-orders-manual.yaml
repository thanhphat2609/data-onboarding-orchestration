kind: IngestionJob
name: postgresql-sales-orders-manual
owner: data-team
connection: sales-postgresql-connection
source:
  query: |
    SELECT order_id, customer_id, amount
    FROM orders
sink:
  template: adls_parquet@1
  params:
    target_file_size_mb: 128
    storage_account: dataonboardingplatform
    path: postgresql/sales/orders
