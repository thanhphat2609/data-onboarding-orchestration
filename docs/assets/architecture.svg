<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" width="1240" height="620" role="img" aria-labelledby="t d">
  <title id="t">data-onboarding-orchestration architecture</title>
  <desc id="d">Pull requests from the Ingestion Web UI add connection and job YAML files to this repository. After the merge, the Airflow DAG factory turns each job file into a DAG ingest__&lt;name&gt;, pools follow the connection files, and each run validates, optionally fetches an API into Redpanda, submits a spec to the Flink JobManager, waits and publishes. A published table is an Asset that starts the dbt DAG of data-onboarding-transformation.</desc>
  <style>
    text { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; fill: #14232C; }
    .bg { fill: #FFFFFF; }
    .zone { fill: #E7EEF0; }
    .zl { font-family: Consolas, "JetBrains Mono", monospace; font-size: 11px; letter-spacing: 0.08em; fill: #586A75; }
    .box { fill: #FFFFFF; stroke: #C6D3D9; stroke-width: 1.2; }
    .hl { stroke: #0D776F; stroke-width: 1.6; }
    .dash { fill: none; stroke: #586A75; stroke-dasharray: 5 4; }
    .run { fill: #D3ECE8; stroke: #0D776F; stroke-dasharray: 6 4; }
    .row { fill: #E7EEF0; }
    .bt { font-size: 13px; font-weight: 600; }
    .rt { font-size: 12.5px; font-weight: 600; }
    .bs { font-family: Consolas, "JetBrains Mono", monospace; font-size: 10.5px; fill: #586A75; }
    .edge { fill: none; stroke: #0D776F; stroke-width: 1.6; }
    .pre { stroke-dasharray: 5 4; }
    .aux { fill: none; stroke: #586A75; stroke-dasharray: 3 3; stroke-width: 1.2; }
    .ah { fill: #0D776F; }
    .ahm { fill: #586A75; }
    .badge { fill: #0D776F; }
    .badge-a { fill: #9A5B12; }
    .bn { fill: #FFFFFF; font-family: Consolas, monospace; font-size: 11px; text-anchor: middle; }
    .el { font-family: Consolas, "JetBrains Mono", monospace; font-size: 10.5px; fill: #586A75; }
    .title { font-size: 15px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahm"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1240" height="620"/>
  <text class="title" x="20" y="28">data-onboarding-orchestration</text>
  <text class="bs" x="20" y="44">when and what runs: Airflow · DAG factory · pipelines/ · pools · dbt DAGs</text>
  <rect class="zone" x="20" y="60" width="230" height="530" rx="10"/>
  <text class="zl" x="38" y="82">GITHUB · THIS REPOSITORY</text>
  <rect class="box" x="40" y="90" width="190" height="70" rx="8"/>
  <text class="bt" x="54" y="112">Ingestion Web UI</text>
  <text class="bs" x="54" y="130">opens a pull request</text>
  <text class="bs" x="54" y="146">per saved file</text>
  <rect class="box hl" x="40" y="180" width="190" height="150" rx="8"/>
  <text class="bt" x="54" y="202">pipelines/</text>
  <rect class="row" x="52" y="214" width="166" height="28" rx="6"/>
  <text class="rt" x="64" y="233">connections/&lt;name&gt;.yaml</text>
  <rect class="row" x="52" y="248" width="166" height="28" rx="6"/>
  <text class="rt" x="64" y="267">jobs/&lt;name&gt;.yaml</text>
  <text class="bs" x="54" y="292">CI: schema + name check</text>
  <text class="bs" x="54" y="310">Data Team reviews, merges</text>
  <rect class="box" x="40" y="350" width="190" height="100" rx="8"/>
  <text class="bt" x="54" y="372">Deploy workflow</text>
  <text class="bs" x="54" y="390">secrets + variables → .env</text>
  <text class="bs" x="54" y="406">pipelines-only push syncs</text>
  <text class="bs" x="54" y="422">VM 1 without a click</text>
  <rect class="dash" x="40" y="470" width="190" height="100" rx="8"/>
  <text class="bt" x="54" y="492">Secrets · variables</text>
  <text class="bs" x="54" y="510">PROD_SSH_* · AIRFLOW_*</text>
  <text class="bs" x="54" y="526">ORCHESTRATION_GITHUB_TOKEN</text>
  <text class="bs" x="54" y="542">(used by the ingestion API)</text>
  <rect class="zone" x="290" y="60" width="440" height="530" rx="10"/>
  <text class="zl" x="308" y="82">AIRFLOW 3 · VM 1</text>
  <rect class="box" x="310" y="90" width="400" height="70" rx="8"/>
  <text class="bt" x="324" y="112">Scheduler · DAG processor</text>
  <text class="bs" x="324" y="130">re-parses the factory about every 30 s</text>
  <text class="bs" x="324" y="146">new DAG within a minute of the merge</text>
  <rect class="box hl" x="310" y="176" width="400" height="190" rx="8"/>
  <text class="bt" x="324" y="198">DAG factory · dags/ingestion</text>
  <text class="bs" x="324" y="216">one DAG per job file: ingest__&lt;name&gt;</text>
  <rect class="row" x="322" y="224" width="376" height="28" rx="6"/>
  <text class="rt" x="334" y="243">validate</text>
  <text class="bs" x="688" y="243" text-anchor="end">schema + connection</text>
  <rect class="row" x="322" y="258" width="376" height="28" rx="6"/>
  <text class="rt" x="334" y="277">fetch (API jobs only)</text>
  <text class="bs" x="688" y="277" text-anchor="end">REST → Redpanda</text>
  <rect class="row" x="322" y="292" width="376" height="28" rx="6"/>
  <text class="rt" x="334" y="311">submit → wait</text>
  <text class="bs" x="688" y="311" text-anchor="end">Flink REST</text>
  <rect class="row" x="322" y="326" width="376" height="28" rx="6"/>
  <text class="rt" x="334" y="345">publish</text>
  <text class="bs" x="688" y="345" text-anchor="end">emits an Asset</text>
  <rect class="box" x="310" y="382" width="400" height="60" rx="8"/>
  <text class="bt" x="324" y="404">Pools · conn__&lt;name&gt;</text>
  <text class="bs" x="324" y="422">pool_sync_loop.sh: from connections/, every minute</text>
  <rect class="box" x="310" y="458" width="400" height="60" rx="8"/>
  <text class="bt" x="324" y="480">dags/transformation</text>
  <text class="bs" x="324" y="498">runs when the table's Asset is published</text>
  <rect class="box" x="310" y="534" width="190" height="44" rx="8"/>
  <text class="bt" x="324" y="556">PostgreSQL</text>
  <text class="bs" x="324" y="574">airflow · platform</text>
  <rect class="dash" x="520" y="534" width="190" height="44" rx="8"/>
  <text class="bt" x="534" y="556">sources.env</text>
  <text class="bs" x="534" y="574">env:// values</text>
  <rect class="zone" x="770" y="60" width="220" height="330" rx="10"/>
  <text class="zl" x="788" y="82">INGESTION STACK</text>
  <rect class="box hl" x="790" y="90" width="180" height="62" rx="8"/>
  <text class="bt" x="804" y="112">Flink JobManager</text>
  <text class="bs" x="804" y="130">REST :8081</text>
  <text class="bs" x="804" y="146">resolved spec → runner</text>
  <rect class="box" x="790" y="166" width="180" height="62" rx="8"/>
  <text class="bt" x="804" y="188">Redpanda</text>
  <text class="bs" x="804" y="206">topic ingest.&lt;job&gt;</text>
  <text class="bs" x="804" y="222">offsets of the run</text>
  <rect class="box" x="790" y="242" width="180" height="62" rx="8"/>
  <text class="bt" x="804" y="264">code/templates</text>
  <text class="bs" x="804" y="282">schemas · sources · sinks</text>
  <text class="bs" x="804" y="298">mounted read-only</text>
  <rect class="dash" x="790" y="318" width="180" height="56" rx="8"/>
  <text class="bt" x="804" y="340">API sources</text>
  <text class="bs" x="804" y="358">fetch pages them</text>
  <rect class="zone" x="770" y="410" width="220" height="180" rx="10"/>
  <text class="zl" x="788" y="432">TRANSFORMATION REPO</text>
  <rect class="dash" x="790" y="440" width="180" height="130" rx="8"/>
  <text class="bt" x="804" y="462">dbt build</text>
  <text class="bs" x="804" y="480">--select source:&lt;sys&gt;+</text>
  <text class="bs" x="804" y="496">dbt-duckdb · tests</text>
  <rect class="zone" x="1030" y="60" width="190" height="530" rx="10"/>
  <text class="zl" x="1048" y="82">ADLS GEN2</text>
  <rect class="box" x="1050" y="90" width="150" height="56" rx="8"/>
  <text class="bt" x="1064" y="112">raw / parquet</text>
  <text class="bs" x="1064" y="130">Flink output</text>
  <rect class="box" x="1050" y="160" width="150" height="56" rx="8"/>
  <text class="bt" x="1064" y="182">raw / delta</text>
  <text class="bs" x="1064" y="200">Flink output</text>
  <rect class="box" x="1050" y="440" width="150" height="130" rx="8"/>
  <text class="bt" x="1064" y="462">curated / dbt</text>
  <text class="bs" x="1064" y="480">dbt marts</text>
  <text class="bs" x="1064" y="496">analytics-ready</text>
  <path class="edge" d="M135 160 V178" marker-end="url(#arr)"/>
  <path class="edge" d="M230 255 H290 V240 H308" marker-end="url(#arr)"/>
  <path class="aux" d="M230 255 H270 V412 H308" marker-end="url(#arrm)"/>
  <path class="edge" d="M510 140 V174" marker-end="url(#arr)"/>
  <path class="edge" d="M710 300 H750 V121 H788" marker-end="url(#arr)"/>
  <path class="edge" d="M710 250 H740 V197 H788" marker-end="url(#arr)"/>
  <path class="edge" d="M970 121 H1010 V118 H1048" marker-end="url(#arr)"/>
  <path class="aux" d="M510 366 V380" marker-end="url(#arrm)"/>
  <path class="edge pre" d="M710 340 H750 V488 H788" marker-end="url(#arr)"/>
  <path class="edge" d="M970 505 H1048" marker-end="url(#arr)"/>
  <circle class="badge" cx="135" cy="170" r="10"/><text class="bn" x="135" y="174">1</text>
  <circle class="badge" cx="270" cy="255" r="10"/><text class="bn" x="270" y="259">2</text>
  <circle class="badge" cx="510" cy="168" r="10"/><text class="bn" x="510" y="172">3</text>
  <circle class="badge" cx="750" cy="200" r="10"/><text class="bn" x="750" y="204">4</text>
  <circle class="badge" cx="1010" cy="100" r="10"/><text class="bn" x="1010" y="104">5</text>
  <circle class="badge" cx="750" cy="420" r="10"/><text class="bn" x="750" y="424">6</text>
  <circle class="badge" cx="1010" cy="505" r="10"/><text class="bn" x="1010" y="509">7</text>
  <text class="bs" x="20" y="612">1 pull request from the Web UI · 2 merge → factory reads the files · 3 schedule · 4 submit and wait on Flink · 5 Parquet in the lake · 6 publish → Asset · 7 dbt writes curated</text>
</svg>
